# Configuración de Dependabot: actualizaciones mensuales agrupadas.
# Las actualizaciones de seguridad se abren al momento (activadas en Settings).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
